<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10"><title>My Workout V2</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#090b0f;--p:#141820;--p2:#1b2029;--t:#f5f6f8;--m:#969eaa;--l:#2a303b;--a:#eaff4f;--g:#62e3a0;--r:#ff6675}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:85px}
header{position:sticky;top:0;z-index:5;background:#0b0d10ee;backdrop-filter:blur(14px);padding:15px 16px;border-bottom:1px solid var(--l)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.brand i{color:var(--a);font-style:normal}.btn,.icon{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:11px;padding:9px 12px}.icon{padding:8px 10px}
main{padding:18px 16px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:17px;margin-bottom:12px}.hero h1{font-size:27px;margin:5px 0}.muted{color:var(--m);font-size:12px}.eyebrow{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800}.bar{height:7px;background:#2b3039;border-radius:99px;margin:13px 0 6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--a);width:0}.stats{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}.day{border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:11px;padding:8px 2px;font-size:10px}.day b{display:block;color:var(--t);margin-top:3px}.day.active{border-color:var(--a)}.day.done b{color:var(--g)}
.title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.title h2{font-size:16px;margin:0}.exercise{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:13px;margin:9px 0}.exrow{display:flex;align-items:center;gap:10px}.check{width:27px;height:27px;border:1px solid #49505d;background:#0d1015;color:#111;border-radius:9px;flex:none}.check.done{background:var(--a);border-color:var(--a)}.name{font-weight:800}.actions{margin-left:auto;display:flex;gap:5px}.mini{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:8px;padding:7px}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.set{border:1px solid var(--l);background:#0e1116;border-radius:10px;padding:7px}.set label{display:block;color:var(--m);font-size:10px}.set input{width:100%;border:0;background:transparent;color:var(--t);outline:0;font-weight:700;padding:5px 0}.set.done{border-color:var(--g)}.set button{width:100%;border:0;background:transparent;color:var(--g);font-size:11px}
.primary{width:100%;background:var(--a);color:#10120c;border:0;border-radius:12px;padding:12px;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{width:100%;background:var(--p2);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:12px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0d1014f5;border-top:1px solid var(--l);z-index:10;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:var(--m);padding:10px;font-size:10px}.nav b{display:block;font-size:18px}.nav .on{color:var(--a)}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:var(--p);border-radius:21px 21px 0 0;padding:19px;max-height:88vh;overflow:auto}.close{float:right;border:0;background:none;color:var(--m);font-size:24px}.field{margin:11px 0}.field label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0e1116;border:1px solid var(--l);border-radius:10px;color:var(--t)}.timer{text-align:center;font-size:48px;font-weight:900;margin:15px}.toast{position:fixed;bottom:75px;left:50%;transform:translate(-50%,15px);background:#f5f6f8;color:#111;padding:10px 14px;border-radius:10px;font-weight:800;font-size:12px;opacity:0;z-index:30;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body><div class="app">
<header><div class="top"><div class="brand">MY<i>WORKOUT</i></div><button class="icon" onclick="settings()">⚙</button></div></header>
<main id="main"></main>
</div>
<div class="nav"><button onclick="tab('today')" id="n-today"><b>⌂</b>Today</button><button onclick="tab('week')" id="n-week"><b>▦</b>Week</button><button onclick="tab('library')" id="n-library"><b>＋</b>Exercises</button><button onclick="tab('progress')" id="n-progress"><b>↗</b>Progress</button></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const D={
Mon:{name:'Push',parts:'Chest • Shoulders • Triceps',ex:[['Dumbbell Floor Press','Chest','3×8–12'],['Dumbbell Shoulder Press','Shoulders','3×8–12'],['Dumbbell Lateral Raise','Side Delts','3×12–15'],['Dumbbell Overhead Triceps Extension','Triceps','3×10–15'],['Push-ups','Chest • Triceps','3×AMRAP']]},
Tue:{name:'Rest',parts:'Recovery',ex:[]},
Wed:{name:'Pull',parts:'Back • Biceps • Rear Delts',ex:[['One-Arm Dumbbell Row','Back','3×8–12'],['Dumbbell Romanian Deadlift','Hamstrings • Glutes','3×8–12'],['Dumbbell Reverse Fly','Rear Delts','3×12–15'],['Dumbbell Curl','Biceps','3×10–15'],['Hammer Curl','Biceps','3×10–15']]},
Thu:{name:'Legs + Core',parts:'Quads • Glutes • Hamstrings • Core',ex:[['Goblet Squat','Legs','3×8–12'],['Dumbbell Romanian Deadlift','Hamstrings','3×8–12'],['Dumbbell Reverse Lunge','Legs • Glutes','3×8–12'],['Standing Calf Raise','Calves','3×12–20'],['Plank','Core','3×30–60 sec']]},
Fri:{name:'Rest',parts:'Recovery',ex:[]},
Sat:{name:'Upper + Calisthenics',parts:'Upper Body • Posture',ex:[['Push-ups','Chest • Triceps','3×AMRAP'],['One-Arm Dumbbell Row','Back','3×8–12'],['Dumbbell Lateral Raise','Shoulders','3×12–15'],['Dumbbell Curl','Biceps','3×10–15'],['Dead Bug','Core','3×10/side']]},
Sun:{name:'Full Body',parts:'Full Body • Weak Points',ex:[['Goblet Squat','Legs','3×8–12'],['Dumbbell Floor Press','Chest','3×8–12'],['One-Arm Dumbbell Row','Back','3×8–12'],['Dumbbell Shoulder Press','Shoulders','3×8–12'],['Plank','Core','3×30–60 sec']]}
};
const LIB=[['Dumbbell Floor Press','Chest','3×8–12'],['Dumbbell Shoulder Press','Shoulders','3×8–12'],['Dumbbell Lateral Raise','Side Delts','3×12–15'],['Dumbbell Front Raise','Front Delts','3×10–15'],['Dumbbell Overhead Triceps Extension','Triceps','3×10–15'],['Push-ups','Chest • Triceps','3×AMRAP'],['One-Arm Dumbbell Row','Back','3×8–12'],['Dumbbell Romanian Deadlift','Hamstrings • Glutes','3×8–12'],['Dumbbell Reverse Fly','Rear Delts','3×12–15'],['Dumbbell Curl','Biceps','3×10–15'],['Hammer Curl','Biceps','3×10–15'],['Goblet Squat','Legs • Glutes','3×8–12'],['Dumbbell Reverse Lunge','Legs','3×8–12'],['Standing Calf Raise','Calves','3×12–20'],['Plank','Core','3×30–60 sec'],['Dead Bug','Core','3×10/side'],['Mountain Climbers','Core','3×30 sec'],['Bodyweight Squat','Legs','3×15']];
let S=JSON.parse(localStorage.getItem('mw2')||'null')||{routine:D,sets:{},done:{},history:[],prs:{},tab:'today',day:0,workoutStart:null,custom:[]};
let day=DAYS[S.day]||'Mon',activeTab=S.tab||'today',timer=null,secs=90;
const save=()=>localStorage.setItem('mw2',JSON.stringify(S));
const k=(d,i,s)=>d+'_'+i+'_'+s;
function exDone(d,i){return [0,1,2].every(s=>S.sets[k(d,i,s)]?.done)}
function percent(d){let a=S.routine[d].ex;if(!a.length)return 100;return Math.round(a.filter((_,i)=>exDone(d,i)).length/a.length*100)}
function tab(t){activeTab=t;S.tab=t;save();render()}
function choose(d){day=d;S.day=DAYS.indexOf(d);activeTab='today';save();render()}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.getElementById('n-'+activeTab)?.classList.add('on');({today:today,week:week,library:library,progress:progress}[activeTab])()}
function strip(){return `<div class=week>${DAYS.map(d=>`<button class="day ${d==day?'active':''} ${percent(d)==100&&S.routine[d].ex.length?'done':''}" onclick="choose('${d}')">${d}<b>${S.routine[d].name=='Rest'?'REST':percent(d)+'%'}</b></button>`).join('')}</div>`}
function today(){
 let w=S.routine[day],p=percent(day);
 let h=`<div class=hero><div class=eyebrow>${day} • ${w.name}</div><h1>${w.parts}</h1><div class=muted>${w.ex.length} exercises</div><div class=bar><i style="width:${p}%"></i></div><div class=stats><span>${p}% complete</span><span>${w.ex.length&&p==100?'✓ Workout complete':''}</span></div></div>${strip()}`;
 if(!w.ex.length)h+=`<div class=card><h2>🛌 Rest & recover</h2><p class=muted>Tuesday and Friday are recovery days.</p></div>`;
 else {h+=`<div class=title><h2>Today's workout</h2><span class=muted>${w.ex.length} movements</span></div>`;w.ex.forEach((e,i)=>h+=cardEx(day,e,i));h+=`<div class=grid2><button class=secondary onclick="timerOpen()">⏱ Rest timer</button><button class=secondary onclick="finishWorkout()">Finish workout</button></div>`}
 main.innerHTML=h;
}
function cardEx(d,e,i){
 let done=exDone(d,i);
 return `<div class=exercise><div class=exrow><button class="check ${done?'done':''}" onclick="toggleAll('${d}',${i})">${done?'✓':''}</button><div><div class=name>${e[0]}</div><div class=muted>${e[1]} • ${e[2]}</div></div><div class=actions><a class=mini href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+' proper form tutorial')}" target="_blank" rel="noopener">🎥</a><button class=mini onclick="move('${d}',${i})">↕</button><button class=mini onclick="removeEx('${d}',${i})">×</button></div></div><div class=sets>${[0,1,2].map(s=>setBox(d,i,s)).join('')}</div><div class=muted style="margin-top:7px">Target: ${suggest(d,i)}</div></div>`
}
function setBox(d,i,s){
 let o=S.sets[k(d,i,s)]||{},w=o.weight??'',r=o.reps??'';
 return `<div class="set ${o.done?'done':''}"><label>SET ${s+1}</label><input inputmode=decimal placeholder="kg" value="${w}" onchange="logSet('${d}',${i},${s},'weight',this.value)"><input inputmode=numeric placeholder="reps" value="${r}" onchange="logSet('${d}',${i},${s},'reps',this.value)"><button onclick="setDone('${d}',${i},${s})">${o.done?'✓ DONE':'○ complete'}</button></div>`
}
function suggest(d,i){let e=S.routine[d].ex[i],hist=S.prs[e[0]];if(!hist)return'No previous log';return`Last PR: ${hist.weight||0} kg × ${hist.reps||0}` }
function logSet(d,i,s,f,v){let o=S.sets[k(d,i,s)]||{};o[f]=v===''?'':Number(v);S.sets[k(d,i,s)]=o;save();if(f=='weight'&&Number(v)>Number(S.prs[S.routine[d].ex[i][0]]?.weight||0)){S.prs[S.routine[d].ex[i][0]]={...S.prs[S.routine[d].ex[i][0]],weight:Number(v)}}}
function setDone(d,i,s){let o=S.sets[k(d,i,s)]||{};o.done=!o.done;S.sets[k(d,i,s)]=o;let e=S.routine[d].ex[i][0];if(o.done){o.reps=o.reps||0;o.weight=o.weight||0;let old=S.prs[e]||{};if(Number(o.weight)>Number(old.weight||0)||(Number(o.weight)==Number(old.weight||0)&&Number(o.reps)>Number(old.reps||0)))S.prs[e]={weight:o.weight,reps:o.reps,date:new Date().toISOString()}}save();render()}
function toggleAll(d,i){let target=!exDone(d,i);[0,1,2].forEach(s=>{let o=S.sets[k(d,i,s)]||{};o.done=target;S.sets[k(d,i,s)]=o});save();render()}
function move(d,i){if(i>=S.routine[d].ex.length-1)return;[S.routine[d].ex[i],S.routine[d].ex[i+1]]=[S.routine[d].ex[i+1],S.routine[d].ex[i]];save();render()}
function removeEx(d,i){if(confirm('Remove this exercise?')){S.routine[d].ex.splice(i,1);save();render()}}
function finishWorkout(){if(percent(day)==100){S.history.push({day,date:new Date().toISOString()});save();toast('Workout saved ✓')}else toast('Complete all exercises first')}
function week(){main.innerHTML=`<div class=hero><div class=eyebrow>Weekly plan</div><h1>Your routine</h1><p class=muted>Dumbbell + bodyweight • Tue/Fri rest</p></div>${DAYS.map(d=>`<div class=card onclick="choose('${d}')"><div class=exrow><div class="check ${percent(d)==100&&S.routine[d].ex.length?'done':''}">${percent(d)==100&&S.routine[d].ex.length?'✓':''}</div><div><b>${d} — ${S.routine[d].name}</b><div class=muted>${S.routine[d].parts}</div></div><b style="margin-left:auto">${S.routine[d].ex.length?percent(d)+'%':'REST'}</b></div></div>`).join('')}`}
function library(){main.innerHTML=`<div class=hero><div class=eyebrow>Exercise library</div><h1>Add exercises</h1><p class=muted>Pick a day and add movements.</p></div><input id=search class="field" style="width:100%;padding:12px;background:#0e1116;color:white;border:1px solid var(--l);border-radius:10px" placeholder="Search..." oninput="filterLib(this.value)"><div id=lib></div>`;filterLib('')}
function filterLib(q){let a=LIB.filter(x=>(x[0]+x[1]).toLowerCase().includes(q.toLowerCase()));lib.innerHTML=a.map((e,i)=>`<div class=card><div class=exrow><div><b>${e[0]}</b><div class=muted>${e[1]} • ${e[2]}</div></div><button class=mini style="margin-left:auto" onclick="addModal(${LIB.indexOf(e)})">＋ Add</button></div></div>`).join('')}
function addModal(i){let e=LIB[i];open(`<button class=close onclick=close()>×</button><h2>Add ${e[0]}</h2><div class=field><label>DAY</label><select id=addday>${DAYS.map(d=>`<option ${d==day?'selected':''}>${d}</option>`).join('')}</select></div><div class=field><label>SETS × REPS</label><input id=scheme value="${e[2]}"></div><button class=primary onclick="add(${i})">Add workout</button>`)}
function add(i){let d=document.getElementById('addday').value;S.routine[d].ex.push([LIB[i][0],LIB[i][1],document.getElementById('scheme').value]);save();close();choose(d);toast('Exercise added ✓')}
function progress(){let prs=Object.entries(S.prs);let streak=calcStreak();main.innerHTML=`<div class=hero><div class=eyebrow>Dashboard</div><h1>Progress</h1><p class=muted>Track strength and consistency.</p></div><div class=grid2><div class=card><div class=muted>WORKOUTS</div><h1>${S.history.length}</h1></div><div class=card><div class=muted>STREAK</div><h1>🔥 ${streak}</h1></div></div><div class=card><h3>Personal records</h3>${prs.length?prs.map(([e,p])=>`<p><b>${e}</b><br><span class=muted>${p.weight||0} kg × ${p.reps||0} reps</span></p>`).join(''):'<p class=muted>No PRs yet. Log your sets.</p>'}</div><div class=card><h3>Ideas to add next</h3><p>📈 Automatic overload</p><p>📊 Volume by muscle</p><p>🏆 PR badges</p><p>📅 Monthly training calendar</p></div>`}
function calcStreak(){let ds=[...new Set(S.history.map(x=>x.date.slice(0,10)))].sort().reverse();if(!ds.length)return 0;let n=0,d=new Date();for(let x of ds){let a=new Date(d.toDateString()),b=new Date(x+'T00:00:00');if((a-b)/86400000<=n+1){n++;d=new Date(b)}else break}return n}
function settings(){open(`<button class=close onclick=close()>×</button><h2>Settings</h2><div class=card><b>Equipment</b><p class=muted>Dumbbells + bodyweight</p></div><div class=card><b>Rest days</b><p class=muted>Tuesday + Friday</p></div><button class=secondary onclick="install()">📲 Install app</button><br><br><button class=secondary onclick="reset()">Reset all data</button>`)}
function video(q){
  const url='https://www.youtube.com/results?search_query='+q+'+proper+form+tutorial';
  window.location.href=url;
}
function timerOpen(){open(`<button class=close onclick=close()>×</button><h2>Rest timer</h2><div id=clock class=timer>${fmt(secs)}</div><div class=grid2><button class=secondary onclick=setT(60)>60 sec</button><button class=secondary onclick=setT(90)>90 sec</button><button class=secondary onclick=setT(120)>120 sec</button><button class=secondary onclick=start()>Start</button></div>`)}
function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}
function setT(x){secs=x;clock.textContent=fmt(secs)}
function start(){clearInterval(timer);timer=setInterval(()=>{secs--;clock.textContent=fmt(Math.max(0,secs));if(secs<=0){clearInterval(timer);navigator.vibrate?.(300);toast('Rest finished')}} ,1000)}
function open(x){sheet.innerHTML=x;modal.classList.add('show')}function close(){clearInterval(timer);modal.classList.remove('show')}
function toast(x){toastEl.textContent=x;toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),1300)}
function reset(){if(confirm('Delete all workout data?')){localStorage.removeItem('mw2');location.reload()}}
let toastEl=document.getElementById('toast');render();
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});function install(){if(deferredPrompt){deferredPrompt.prompt()}else toast('Use your browser menu → Add to Home screen')}
</script><script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body></html>
